<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- 🔹 Título que aparecerá en Google -->
    <title>Consultas IUB (Página NO oficial de la Institución Universitaria de Barranquilla)</title>

    <!-- 🔹 Descripción que Google mostrará debajo del título -->
    <meta name="description" content="Consultas IUB es una plataforma NO oficial para gestionar consultas académicas de la Institución Universitaria de Barranquilla.">

    <link rel="icon" type="image" href="assets/img/logo.png" />

    <link rel="stylesheet" href="assets/css/login.css" />
</head>

<body>

<div class="login-container">

    <!-- Logo principal del formulario -->
    <img src="assets/img/logo.png" alt="Logo de la Institución Universitaria de Barranquilla">

    <div class="Textologin">
        <h1>Identifíquese usando su cuenta en:</h1>
    </div>

    <!-- Formulario de Login -->
    <form id="loginForm" autocomplete="off">
        <input type="text" id="correo" placeholder="Correo" required>
        <input type="password" id="password" placeholder="Contraseña" required>
        <button type="submit">Ingresar</button>
        <p id="error-message"></p>
    </form>

    <a href="Registro.html">Registro</a>

</div>

<script src="assets/javascript/index.js"></script>

</body>
</html>
